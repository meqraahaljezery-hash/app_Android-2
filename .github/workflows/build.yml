name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من صفحة Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (الإصدار 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Gradle مع تفعيل التخزين المؤقت (Caching) لتسريع البناء
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. منح صلاحية التنفيذ لملف gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. إنشاء ملف .env وحقن مفتاح Gemini السري بداخله
      - name: Generate .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      # 6. بناء ملف APK (نسخة Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. رفع ملف APK الناتج لتحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7