name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets and Environment Files
        env:
          RAW_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
          RAW_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RAW_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAW_APPCHECK_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          # 1. إنشاء ملف .env للمفاتيح
          touch .env
          echo "GEMINI_API_KEY=${RAW_GEMINI_KEY}" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=${RAW_APPCHECK_TOKEN}" >> .env
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> .env
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> .env
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> .env

          # 2. فك تشفير ملف google-services.json من Base64
          if [ -n "$RAW_GOOGLE_SERVICES" ]; then
            echo "$RAW_GOOGLE_SERVICES" | base64 -di > app/google-services.json
            # التحقق هل هو json سليم أم لا بعد فك التشفير
            if python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
              echo "✓ google-services.json is valid JSON"
            else
              echo "⚠ Warning: GOOGLE_SERVICES_BASE64 is not valid JSON after decoding! Removing to prevent build failure..."
              rm -f app/google-services.json
            fi
          fi

          # 3. فك تشفير مفتاح الديبوغ الثابت
          if [ -n "$RAW_DEBUG_KEYSTORE" ]; then
            echo "$RAW_DEBUG_KEYSTORE" | base64 -di > debug.keystore
            echo "✓ debug.keystore decoded successfully."
          else
            echo "⚠ Warning: DEBUG_KEYSTORE_BASE64 is empty! Generating a temporary one..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AndroidDebug,O=Android,C=US"
          fi
          
          echo "✓ debug.keystore status:"
          ls -la debug.keystore

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maqraah-AlJazari-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14