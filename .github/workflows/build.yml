name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets and Environment Files
        env:
          RAW_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RAW_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RAW_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAW_APPCHECK_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          # 1. إنشاء ملف .env للمفاتيح
          touch .env
          echo "GEMINI_API_KEY=${RAW_GEMINI_KEY}" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=${RAW_APPCHECK_TOKEN}" >> .env

          # 2. كتابة ملف google-services.json والتحقق من صحته كـ JSON سليم
          if [ -n "$RAW_GOOGLE_SERVICES" ]; then
            printf "%s\n" "$RAW_GOOGLE_SERVICES" > app/google-services.json
            
            # التحقق هل هو json سليم أم لا بواسطة python
            if python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
              echo "✓ google-services.json is valid JSON"
            else
              echo "⚠ Warning: GOOGLE_SERVICES_JSON is not valid JSON! Removing to prevent build failure..."
              rm -f app/google-services.json
            fi
          fi

          # 3. توفير ملف debug.keystore وضمان وجوده دائماً
          if [ -n "$RAW_DEBUG_KEYSTORE" ]; then
            echo "$RAW_DEBUG_KEYSTORE" | base64 -d > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # إذا لم يتوفر ملف debug.keystore، يتم توليده فوراً عبر keytool بالمواصفات القياسية
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "✓ debug.keystore verified at: $(pwd)/debug.keystore"
          chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maqraah-AlJazari-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
